shamefullyHoist: true

# Force node-xlsx to use the same vendored xlsx tarball as workspace packages
overrides:
  'node-xlsx>xlsx': 'file:./vendor/xlsx-0.20.3.tgz'

packages:
  - "packages/*"

# Security window: block packages < 30 days old
minimumReleaseAge: 43200 # 30 days in minutes (30 * 24 * 60)

# only accept versions within minor semver range
savePrefix: '~'

allowBuilds:
  '@scarf/scarf': false # Analytics, not required
  '@sentry/cli': true # Required for Sentry error tracking
  bcrypt: true
  es5-ext: false # Polyfill, not critical
  esbuild: true # Required for build
  mongodb-memory-server: true # Required for tests
  puppeteer: true # Required for scraping in tools
  tsc: true
  unrs-resolver: false # Not critical

# Exclude packages from the security window (updated on pnpm install)
minimumReleaseAgeExclude:
  - prettier-plugin-svelte@3.5.2
